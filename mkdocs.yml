site_name: The Idea Vault
repo_name: RafanHRayan/The-Idea-Vault
repo_url: https://github.com/RafanHRayan/The-Idea-Vault
theme:
  name: material
  font:
    text: Sofia Sans
    code: JetBrains Mono
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
  # Dark Mode
  - scheme: slate
    toggle:
      icon: material/weather-sunny
      name: Dark Mode
    primary: blue
    accent: light blue

  # Light Mode
  - scheme: default
    toggle:
      icon: material/weather-night
      name: Light Mode
    primary: blue
    accent: light blue
  features:
    - navigation.footer
    - content.code.copy
    - content.footnote.tooltips

nav:
  - Home: home.md
  - Reference: ref.md
  - Changelog:
    - 2026 Changelog: changelogs/2026.md
    - Past Changelogs:
      - 2025 Changelog: changelogs/2025.md

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - footnotes
  - toc:
      toc_depth: 5

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RafanHRayan

copyright: Copyright &copy; 2025 Rafan H. Rayan